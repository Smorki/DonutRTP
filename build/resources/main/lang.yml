#Here you can change all the messages and action bars of the plugin

#RTP Messages
messages:
  teleport-on-cooldown-message: '&cYou must wait %wait_time%s before you can teleport again.'
  teleported-message: '&bSuccessfully teleported'
  fail-message: '&cNo location found! &7(Not a /bug)'
  no-world-permission-message: '&cThis world is not available!'
  no-permission: "&cYou do not have permission to use this command!"
  player-only: "&cThis command can only be used by players!"
  teleporting-cancel-message: '&cCancelled!'
  reload: "&bDonutRtp has been reloaded!"
  zone-enter-message: '&fYou entered the &cRTP &cZone&f!'
  zone-leave-message: '&fYou left the &cRTP &cZone&f!'

  #Queue Messages
  rtp-join-queue-title: '&bRTP Queue'
  rtp-join-queue-sub-title: '&fYou are now in the &bRTP Queue'
  rtp-join-queue-message: '&fYou joined the &bRTP Queue!'

  rtp-first-join-queue-broadcast:
    - '&f'
    - '&b▶ RTP Queue ▶'
    - '&f'
    - '&b%player% &fis waiting for an opponent in the &bRTP Queue'
    - '&f'
    - '&b▶ &7Join with &7&n/rtpqueue'
    - '&f'

  rtp-quit-queue-title: '&bRTP Queue'
  rtp-quit-queue-sub-title: '&fYou left the &bRTP Queue'
  rtp-quit-queue-message: '&fYou left the &bRTP Queue!'
  rtp-queue-countdown-message: '&fFight starts in &b%seconds%s'
  rtp-queue-countdown-title: '&bRTP Queue'
  rtp-queue-countdown-sub-title: '&fTeleport in &b%seconds%s'
  rtp-queue-teleporting-title: '&bRTP Queue'
  rtp-queue-teleporting-sub-title: '&fYou have been teleported'
  rtp-cannot-leave-match-found: '&cYou cannot leave the queue because a match has been found!'
  rtp-cannot-leave-in-match: '&cYou cannot leave the queue because you are already in a match!'
  rtp-already-in-match: '&cYou are already in a match! Wait until it is over.'
  rtp-cooldown-message: '&cYou must wait before you can queue again!'
  rtp-opponent-left: '&cYour opponent has left the game!'
  rtp-match-ended: '&bYour match has ended. You can queue again now.'

action-bars:
  teleported-message: '&bSuccessfully teleported'
  fail-message: '&cNo location found! &7(Not a /bug)'
  reload: "&bDonutRtp has been reloaded!"
  teleporting-cancel-message: '&cCancelled!'
  rtp-queue-action-bar: '&b▶ &fWaiting for &b1 &fplayer! &7&n(/rtpqueue)'
  rtp-quit-queue-action-bar: '&fYou left the &bRTP Queue!'
  rtp-queue-countdown-action-bar: '&fFight starts in &b%seconds%s'
  rtp-queue-teleporting-action-bar: '&fMatch found! Good luck!'

cooldown:
  module:
    chat:
      enabled: true
      message:
        - "&fTeleport in &b%time%s"
    actionbar:
      enabled: true
      message:
        - "&fTeleport in &b%time%s"
    title:
      enabled: false
      message:
        - ""
    subtitle:
      enabled: false
      message:
        - ""